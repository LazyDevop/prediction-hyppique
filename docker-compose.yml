services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

  ingestion:
    build: ./backend
    command: ["python", "-m", "app.jobs.scheduler"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - INGEST_HOUR=6
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

  # Instantanés de cotes à H-60, H-30, H-10 et H-2 : service à part pour que
  # le passage horaire des pronostics ne puisse pas retarder le H-2.
  cotes:
    build: ./backend
    command: ["python", "-m", "app.jobs.cotes_instantanees"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - COTES_POLL_SECONDS=30
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

volumes:
  hippique_data:
