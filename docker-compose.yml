services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

  ingestion:
    build: ./backend
    command: ["python", "-m", "app.jobs.scheduler"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - INGEST_HOUR=6
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

  # Instantanés de cotes à H-60, H-30, H-10 et H-2 : service à part pour que
  # le passage horaire des pronostics ne puisse pas retarder le H-2.
  cotes:
    build: ./backend
    command: ["python", "-m", "app.jobs.cotes_instantanees"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - COTES_POLL_SECONDS=30
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

  # Pronostics du modèle ML (variante "ml") : matin à PRONOSTICS_HEURE, puis
  # H-60, H-30, H-15 et H-10 dès que `cotes` a stocké l'instantané. Le modèle
  # et l'ajustement alpha/beta sont montés en lecture seule (jamais copiés
  # dans l'image ni commités).
  pronostics:
    build: ./backend
    command: ["python", "-m", "app.jobs.pronostics_ml"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - PRONOSTICS_HEURE=7
      - PRONOSTICS_POLL_SECONDS=30
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
      - ./ml/runs/2026-11-09:/app/modele/fondamental:ro
      - ./ml/runs/2026-11-10-combine-r1:/app/modele/combine:ro
    restart: unless-stopped

  # File de reconstruction de l'historique turfinfo : reprend seule après un
  # redémarrage du PC ou de Docker (jours complets sautés), puis reste au
  # repos une fois terminée (marqueur /app/data/rebuild_file_terminee).
  rebuild:
    build: ./backend
    command: ["sh", "/app/app/jobs/rebuild_file.sh"]
    environment:
      - DATABASE_URL=sqlite:////app/data/hippique.db
      - PMU_REQUEST_DELAY=2
      - PMU_REQUEST_JITTER=2
      - PMU_REQUEST_TIMEOUT=45
    env_file:
      - path: .env
        required: false
    volumes:
      - hippique_data:/app/data
    restart: unless-stopped

volumes:
  hippique_data:
